name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (with libass)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q clipforge tests
      - name: Smoke test (mock LLM, synthetic stream; also checks .claude/agents mirrors)
        run: python tests/smoke_test.py
